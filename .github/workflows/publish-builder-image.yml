name: Publish Builder Image

on:
  workflow_call:
    inputs:
      west_yml_path:
        type: string
        required: false
        default: "config/west.yml"
env:
  DOCKERFILE: "template/Dockerfile"
  REPOSITORY: "skubmdi/docker-zmk-builder"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write
    
    steps:
      - name: Chcekout Dockerfile
        uses: actions/checkout@v4
        with:
          path: ${{ env.REPOSITORY }}
          repository: ${{ env.REPOSITORY }}
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ env.DOCKERFILE }}
      - name: Chcekout West Config
        uses: actions/checkout@v4
        with:
          path: ${{ github.repository }}
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ inputs.west_yml_path }}
      - name: Copy Files
        run: |
          mkdir -p config
          cp "${{ env.REPOSITORY }}/${{ env.DOCKERFILE }}" ./
          cp "${{ github.repository }}/${{ inputs.west_yml_path }}" ./config/west.yml
      - name: Downcase repository name
        run: |
          echo "IMAGE_NAME=${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV
      - name: Test
        run: ls -al $(find . -type f)
