name: Publish Builder Image

on:
  workflow_call:
    inputs:
      west_yml_path:
        type: string
        required: false
        default: "config/west.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write
    
    steps:
      - name: Chcekout Dockerfile
        uses: actions/checkout@v4
        with:
          repository: skubmdi/docker-zmk-builder
      - name: Chcekout West Config
        uses: actions/checkout@v4
        with:
          path: template
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ inputs.west_yml_path }}
      # - name: Rename West Config
      #   run: |
      #     mkdir -p config
      #     mv "${{ inputs.west_yml_path }}" config/west.yml
      - name: Downcase repository name
        run: |
          echo "IMAGE_NAME=${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV
      
      - name: Test
        run: |
          echo ghcr.io/${{ env.image_name }}:${{ github.ref_name }}
          ls -l $(find . -type f)
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          context: template
          tags: ghcr.io/${{ env.image_name }}:${{ github.ref_name }}
